<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>VVB Wave Animations</title>
  
  <!-- Web font fallback for academic math styling across systems -->
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/katex@0.16.8/dist/katex.min.css">
  <script defer src="https://cdn.jsdelivr.net/npm/katex@0.16.8/dist/katex.min.js"></script>
  <script defer src="https://cdn.jsdelivr.net/npm/katex@0.16.8/dist/contrib/auto-render.min.js"
    onload="renderMathInElement(document.body, {delimiters: [{left: '$', right: '$', display: false}]});"></script>

  <style>
    body {
      font-family: 'Times New Roman', Times, serif;
      background-color: #ffffff;
      color: #000000;
      margin: 20px;
      display: flex;
      flex-direction: column;
      align-items: center;
    }

    .slide-container {
      width: 100%;
      max-width: 1000px;
    }

    .slide-title {
      font-size: 1.3rem;
      text-align: center;
      margin-bottom: 4px;
      font-family: 'Times New Roman', Times, serif;
    }

    .slide-subtitle {
      font-size: 1.1rem;
      text-align: center;
      margin-top: 0;
      margin-bottom: 16px;
      font-family: 'Times New Roman', Times, serif;
    }

    /* Math variables specific font styling (Cambria Math) */
    .math-var {
      font-family: 'Cambria Math', 'STIX Two Math', 'Times New Roman', serif;
      font-style: italic;
      font-weight: normal;
    }

    /* 6x5 CSS Grid Setup */
    .animation-grid {
      display: grid;
      grid-template-columns: 80px 80px repeat(4, 1fr);
      grid-template-rows: 40px 40px repeat(3, 1fr);
      border: 1px solid #ffffff;
      background-color: #ffffff;
    }

    /* Shared cell styling */
    .grid-cell {
      display: flex;
      justify-content: center;
      align-items: center;
      border: 1px solid #ffffff;
      font-size: 1.3rem;
      font-family: 'Times New Roman', Times, serif;
      font-weight: normal;
    }

    /* Grey Banners */
    .grey-banner {
      background-color: #a6a6a6;
      color: #ffffff;
      box-shadow: inset 0 0 5px rgba(0,0,0,0.2);
    }

    /* Spanning Rules for Grey Banners */
    .sigma-top {
      grid-column: 3 / span 4;
      grid-row: 1;
    }

    .sigma-left {
      grid-column: 1;
      grid-row: 3 / span 3;
    }

    /* Orange Headers & Labels */
    .orange-cell {
      background-color: #f2a47e;
    }

    /* Video Cells & Overlays */
    .video-cell {
      background-color: #333333;
      border: 1px solid #ffffff;
      position: relative;
      aspect-ratio: 1 / 1;
      overflow: hidden;
    }

    video {
      width: 100%;
      height: 100%;
      object-fit: cover;
      display: block;
    }

    /* Bottom-Right Overlay Label */
    .dl-label {
      position: absolute;
      bottom: 6px;
      right: 10px;
      color: #ffffff;
      font-family: 'Times New Roman', Times, serif;
      font-size: 1.25rem;
      font-weight: normal;
      pointer-events: none;
      text-shadow: 1px 1px 3px rgba(0, 0, 0, 0.9);
      display: flex;
      align-items: center;
      gap: 3px;
      z-index: 10;
    }

    /* Styled Ell-Bar (\bar{\ell}) */
    .ell-bar-text {
      position: relative;
      font-style: italic;
      display: inline-block;
      margin-right: 2px;
      padding-top: 1px;
    }

    .ell-bar-text::before {
      content: '';
      position: absolute;
      top: 2px;
      left: 0;
      width: 100%;
      height: 1.2px;
      background-color: #ffffff;
    }
  </style>
</head>
<body>

<div class="slide-container">
  <div class="slide-title">
    In the below animations : <span class="math-var">&alpha;</span> = 0, <span class="math-var">&beta;</span> = <span class="math-var">&pi;</span>/2
  </div>
  <div class="slide-subtitle">(animations are plotted <strong>without</strong> the approximation)</div>

  <div class="animation-grid">
    <!-- Row 1: Top Spanning Grey Banner -->
    <div class="grid-cell grey-banner sigma-top">
      <span class="math-var">&sigma;'</span> = &minus;1
    </div>

    <!-- Row 2: Column Headers -->
    <div class="grid-cell orange-cell" style="grid-column: 3;">
      <span class="math-var">&ell;'</span> = &minus;1
    </div>
    <div class="grid-cell orange-cell" style="grid-column: 4;">
      <span class="math-var">&ell;'</span> = 0
    </div>
    <div class="grid-cell orange-cell" style="grid-column: 5;">
      <span class="math-var">&ell;'</span> = 1
    </div>
    <div class="grid-cell orange-cell" style="grid-column: 6;">
      <span class="math-var">&ell;'</span> = 2
    </div>

    <!-- Left Vertical Spanning Grey Banner -->
    <div class="grid-cell grey-banner sigma-left">
      <span class="math-var">&sigma;</span> = 1
    </div>

    <!-- Row 3: l = -1 -->
    <div class="grid-cell orange-cell" style="grid-column: 2; grid-row: 3;">
      <span class="math-var">&ell;</span> = &minus;1
    </div>
    <div class="video-cell">
      <video autoplay loop muted playsinline oncanplay="this.play()"><source src="l_-1_lp_-1.mp4" type="video/mp4"></video>
      <div class="dl-label"><span class="ell-bar-text">&ell;</span> = &minus;1</div>
    </div>
    <div class="video-cell">
      <video autoplay loop muted playsinline oncanplay="this.play()"><source src="l_-1_lp_0.mp4" type="video/mp4"></video>
      <div class="dl-label">&minus;1/2</div>
    </div>
    <div class="video-cell">
      <video autoplay loop muted playsinline oncanplay="this.play()"><source src="l_-1_lp_1.mp4" type="video/mp4"></video>
      <div class="dl-label">0</div>
    </div>
    <div class="video-cell">
      <video autoplay loop muted playsinline oncanplay="this.play()"><source src="l_-1_lp_2.mp4" type="video/mp4"></video>
      <div class="dl-label">1/2</div>
    </div>

    <!-- Row 4: l = 0 -->
    <div class="grid-cell orange-cell" style="grid-column: 2; grid-row: 4;">
      <span class="math-var">&ell;</span> = 0
    </div>
    <div class="video-cell">
      <video autoplay loop muted playsinline oncanplay="this.play()"><source src="l_0_lp_-1.mp4" type="video/mp4"></video>
      <div class="dl-label">&minus;1/2</div>
    </div>
    <div class="video-cell">
      <video autoplay loop muted playsinline oncanplay="this.play()"><source src="l_0_lp_0.mp4" type="video/mp4"></video>
      <div class="dl-label">0</div>
    </div>
    <div class="video-cell">
      <video autoplay loop muted playsinline oncanplay="this.play()"><source src="l_0_lp_1.mp4" type="video/mp4"></video>
      <div class="dl-label">1/2</div>
    </div>
    <div class="video-cell">
      <video autoplay loop muted playsinline oncanplay="this.play()"><source src="l_0_lp_2.mp4" type="video/mp4"></video>
      <div class="dl-label">1</div>
    </div>

    <!-- Row 5: l = 1 -->
    <div class="grid-cell orange-cell" style="grid-column: 2; grid-row: 5;">
      <span class="math-var">&ell;</span> = 1
    </div>
    <div class="video-cell">
      <video autoplay loop muted playsinline oncanplay="this.play()"><source src="l_1_lp_-1.mp4" type="video/mp4"></video>
      <div class="dl-label">0</div>
    </div>
    <div class="video-cell">
      <video autoplay loop muted playsinline oncanplay="this.play()"><source src="l_1_lp_0.mp4" type="video/mp4"></video>
      <div class="dl-label">1/2</div>
    </div>
    <div class="video-cell">
      <video autoplay loop muted playsinline oncanplay="this.play()"><source src="l_1_lp_1.mp4" type="video/mp4"></video>
      <div class="dl-label">1</div>
    </div>
    <div class="video-cell">
      <video autoplay loop muted playsinline oncanplay="this.play()"><source src="l_1_lp_2.mp4" type="video/mp4"></video>
      <div class="dl-label">3/2</div>
    </div>
  </div>
</div>

</body>
</html>
