<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>VVB Wave Animations</title>
  <style>
    body { font-family: Arial, sans-serif; background-color: #ffffff; color: #000000; margin: 20px; display: flex; flex-direction: column; align-items: center; }
    .slide-container { width: 100%; max-width: 1000px; }
    .slide-title { font-size: 1.25rem; margin-bottom: 4px; }
    .slide-subtitle { font-size: 1.1rem; margin-top: 0; margin-bottom: 16px; }
    .animation-grid { display: grid; grid-template-columns: 120px repeat(4, 1fr); border: 1px solid #e07b53; background-color: #ffffff; }
    .header-cell, .label-cell, .corner-cell { background-color: #f2a47e; display: flex; justify-content: center; align-items: center; font-size: 1.2rem; font-weight: bold; border: 1px solid #ffffff; padding: 10px; }
    .corner-cell { flex-direction: column; gap: 6px; }
    .badge { background-color: #8c8c8c; color: #ffffff; padding: 4px 10px; border-radius: 4px; font-size: 0.95rem; font-weight: bold; box-shadow: 1px 1px 3px rgba(0,0,0,0.3); }
    .video-cell { background-color: #333333; border: 1px solid #ffffff; position: relative; aspect-ratio: 1 / 1; overflow: hidden; }
    video { width: 100%; height: 100%; object-fit: cover; display: block; }
  </style>
</head>
<body>
<div class="slide-container">
  <div class="slide-title">In the below animations : &alpha; = 0, &beta; = &pi;/2</div>
  <div class="slide-subtitle">(animations are plotted <strong>without</strong> the approximation)</div>
  <div class="animation-grid">
    <div class="corner-cell"><div class="badge">&sigma;' = &minus;1</div><div class="badge">&sigma; = 1</div></div>
    <div class="header-cell"><i>l</i> ' = &minus;1</div><div class="header-cell"><i>l</i> ' = 0</div><div class="header-cell"><i>l</i> ' = 1</div><div class="header-cell"><i>l</i> ' = 2</div>
    
    <div class="label-cell"><i>l</i> = &minus;1</div>
    <div class="video-cell"><video src="l_-1_lp_-1.mp4" autoplay loop muted playsinline></video></div>
    <div class="video-cell"><video src="l_-1_lp_0.mp4" autoplay loop muted playsinline></video></div>
    <div class="video-cell"><video src="l_-1_lp_1.mp4" autoplay loop muted playsinline></video></div>
    <div class="video-cell"><video src="l_-1_lp_2.mp4" autoplay loop muted playsinline></video></div>
    
    <div class="label-cell"><i>l</i> = 0</div>
    <div class="video-cell"><video src="l_0_lp_-1.mp4" autoplay loop muted playsinline></video></div>
    <div class="video-cell"><video src="l_0_lp_0.mp4" autoplay loop muted playsinline></video></div>
    <div class="video-cell"><video src="l_0_lp_1.mp4" autoplay loop muted playsinline></video></div>
    <div class="video-cell"><video src="l_0_lp_2.mp4" autoplay loop muted playsinline></video></div>
    
    <div class="label-cell"><i>l</i> = 1</div>
    <div class="video-cell"><video src="l_1_lp_-1.mp4" autoplay loop muted playsinline></video></div>
    <div class="video-cell"><video src="l_1_lp_0.mp4" autoplay loop muted playsinline></video></div>
    <div class="video-cell"><video src="l_1_lp_1.mp4" autoplay loop muted playsinline></video></div>
    <div class="video-cell"><video src="l_1_lp_2.mp4" autoplay loop muted playsinline></video></div>
  </div>
</div>
</body>
</html>
