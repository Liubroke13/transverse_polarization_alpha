<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>VVB Transverse Polarization Animations Matrix</title>
  
  <style>
    body {
      font-family: 'Times New Roman', Times, serif;
      background-color: #ffffff;
      color: #000000;
      margin: 20px;
      display: flex;
      flex-direction: column;
      align-items: center;
    }

    /* Rotation Notice Banner for Mobile Portrait Mode */
    .rotate-notice {
      display: none;
      background-color: #fff3cd;
      color: #856404;
      border: 1px solid #ffeeba;
      padding: 10px 16px;
      border-radius: 6px;
      margin-bottom: 15px;
      text-align: center;
      font-size: 0.95rem;
      width: 100%;
      max-width: 960px;
      box-sizing: border-box;
    }

    @media screen and (max-width: 768px) and (orientation: portrait) {
      .rotate-notice {
        display: block;
      }
    }

    .slide-container {
      width: 100%;
      max-width: 960px;
    }

    .slide-title {
      font-size: 1.25rem;
      text-align: center;
      margin-bottom: 2px;
    }

    .slide-subtitle {
      font-size: 1.05rem;
      text-align: center;
      margin-top: 0;
      margin-bottom: 16px;
    }

    .math {
      font-family: 'Cambria Math', 'STIX Two Math', 'Times New Roman', serif;
      font-style: italic;
    }

    .animation-grid {
      display: grid;
      grid-template-columns: 70px 70px repeat(4, 1fr);
      grid-template-rows: 35px 35px repeat(3, 1fr);
      gap: 2px;
      background-color: #ffffff;
    }

    .grid-cell {
      display: flex;
      justify-content: center;
      align-items: center;
      font-size: 1.3rem;
    }

    .grey-banner {
      background-color: #a6a6a6;
      color: #000000;
      font-weight: normal;
    }

    .sigma-top {
      grid-column: 3 / span 4;
      grid-row: 1;
    }

    .sigma-left {
      grid-column: 1;
      grid-row: 3 / span 3;
    }

    /* 依據截圖替換為橘色標籤背景 */
    .orange-cell {
      background-color: #fca385;
      color: #000000;
      font-weight: normal;
    }

    .video-cell {
      position: relative;
      width: 100%;
      aspect-ratio: 1 / 1;
      background-color: #000000;
      border: 1px solid #ffffff;
      overflow: hidden;
    }

    video {
      width: 100%;
      height: 100%;
      object-fit: cover;
      display: block;
      pointer-events: none; /* Prevents touch/click native UI buttons on iPad */
      -webkit-transform: translateZ(0);
    }

    /* Remove WebKit play controls overlay on iOS/iPadOS */
    video::-webkit-media-controls {
      display: none !important;
    }
    video::-webkit-media-controls-start-playback-button {
      display: none !important;
      -webkit-appearance: none !important;
    }

    /* 右下角標記樣式（透明背景、白色文字加陰影） */
    .l-overlay {
      position: absolute;
      bottom: 4px;
      right: 8px;
      color: #ffffff;
      font-family: 'Times New Roman', Times, serif;
      font-size: 1.4rem;
      pointer-events: none;
      text-shadow: 1px 1px 3px #000000, -1px -1px 3px #000000;
      z-index: 10;
      display: flex;
      align-items: center;
    }

    .l-bar-text {
      text-decoration: overline;
      font-style: italic;
      display: inline-block;
      margin-right: 4px;
    }
  </style>
</head>
<body>

<div class="rotate-notice">
    <strong>Please rotate your phone for optimal display.</strong> 
</div>

<div class="slide-container">
  <div class="slide-title">
    In the below animations : <span class="math">&alpha;</span> = 0, <span class="math">&beta;</span> = <span class="math">&pi;</span>/2
  </div>
  <div class="slide-subtitle">(animations are plotted <strong>without</strong> the approximation)</div>

  <div class="animation-grid">
    <!-- Top Header: Sigma Prime -->
    <div class="grid-cell grey-banner sigma-top">
      <span class="math">&sigma;'</span> = &minus;1
    </div>

    <!-- Top Headers: Ell Prime -->
    <div class="grid-cell orange-cell" style="grid-column: 3; grid-row: 2;">
      <span class="math">&ell;'</span> = &minus;1
    </div>
    <div class="grid-cell orange-cell" style="grid-column: 4; grid-row: 2;">
      <span class="math">&ell;'</span> = 0
    </div>
    <div class="grid-cell orange-cell" style="grid-column: 5; grid-row: 2;">
      <span class="math">&ell;'</span> = 1
    </div>
    <div class="grid-cell orange-cell" style="grid-column: 6; grid-row: 2;">
      <span class="math">&ell;'</span> = 2
    </div>

    <!-- Left Header: Sigma -->
    <div class="grid-cell grey-banner sigma-left">
      <span class="math">&sigma;</span> = 1
    </div>

    <!-- Row 1: Ell = -1 -->
    <div class="grid-cell orange-cell" style="grid-column: 2; grid-row: 3;">
      <span class="math">&ell;</span> = &minus;1
    </div>
    
    <div class="video-cell" style="grid-column: 3; grid-row: 3;">
      <video src="l_-1_lp_-1.mp4" muted loop playsinline webkit-playsinline preload="auto" disablePictureInPicture controlsList="nodownload no-fullscreen noremoteplayback"></video>
      <div class="l-overlay"><span class="l-bar-text">&ell;</span> = &minus;1</div>
    </div>

    <div class="video-cell" style="grid-column: 4; grid-row: 3;">
      <video src="l_-1_lp_0.mp4" muted loop playsinline webkit-playsinline preload="auto" disablePictureInPicture controlsList="nodownload no-fullscreen noremoteplayback"></video>
      <div class="l-overlay">&minus;1/2</div>
    </div>

    <div class="video-cell" style="grid-column: 5; grid-row: 3;">
      <video src="l_-1_lp_1.mp4" muted loop playsinline webkit-playsinline preload="auto" disablePictureInPicture controlsList="nodownload no-fullscreen noremoteplayback"></video>
      <div class="l-overlay">0</div>
    </div>

    <div class="video-cell" style="grid-column: 6; grid-row: 3;">
      <video src="l_-1_lp_2.mp4" muted loop playsinline webkit-playsinline preload="auto" disablePictureInPicture controlsList="nodownload no-fullscreen noremoteplayback"></video>
      <div class="l-overlay">1/2</div>
    </div>

    <!-- Row 2: Ell = 0 -->
    <div class="grid-cell orange-cell" style="grid-column: 2; grid-row: 4;">
      <span class="math">&ell;</span> = 0
    </div>

    <div class="video-cell" style="grid-column: 3; grid-row: 4;">
      <video src="l_0_lp_-1.mp4" muted loop playsinline webkit-playsinline preload="auto" disablePictureInPicture controlsList="nodownload no-fullscreen noremoteplayback"></video>
      <div class="l-overlay">&minus;1/2</div>
    </div>

    <div class="video-cell" style="grid-column: 4; grid-row: 4;">
      <video src="l_0_lp_0.mp4" muted loop playsinline webkit-playsinline preload="auto" disablePictureInPicture controlsList="nodownload no-fullscreen noremoteplayback"></video>
      <div class="l-overlay">0</div>
    </div>

    <div class="video-cell" style="grid-column: 5; grid-row: 4;">
      <video src="l_0_lp_1.mp4" muted loop playsinline webkit-playsinline preload="auto" disablePictureInPicture controlsList="nodownload no-fullscreen noremoteplayback"></video>
      <div class="l-overlay">1/2</div>
    </div>

    <div class="video-cell" style="grid-column: 6; grid-row: 4;">
      <video src="l_0_lp_2.mp4" muted loop playsinline webkit-playsinline preload="auto" disablePictureInPicture controlsList="nodownload no-fullscreen noremoteplayback"></video>
      <div class="l-overlay">1</div>
    </div>

    <!-- Row 3: Ell = 1 -->
    <div class="grid-cell orange-cell" style="grid-column: 2; grid-row: 5;">
      <span class="math">&ell;</span> = 1
    </div>

    <div class="video-cell" style="grid-column: 3; grid-row: 5;">
      <video src="l_1_lp_-1.mp4" muted loop playsinline webkit-playsinline preload="auto" disablePictureInPicture controlsList="nodownload no-fullscreen noremoteplayback"></video>
      <div class="l-overlay">0</div>
    </div>

    <div class="video-cell" style="grid-column: 4; grid-row: 5;">
      <video src="l_1_lp_0.mp4" muted loop playsinline webkit-playsinline preload="auto" disablePictureInPicture controlsList="nodownload no-fullscreen noremoteplayback"></video>
      <div class="l-overlay">1/2</div>
    </div>

    <div class="video-cell" style="grid-column: 5; grid-row: 5;">
      <video src="l_1_lp_1.mp4" muted loop playsinline webkit-playsinline preload="auto" disablePictureInPicture controlsList="nodownload no-fullscreen noremoteplayback"></video>
      <div class="l-overlay">1</div>
    </div>

    <div class="video-cell" style="grid-column: 6; grid-row: 5;">
      <video src="l_1_lp_2.mp4" muted loop playsinline webkit-playsinline preload="auto" disablePictureInPicture controlsList="nodownload no-fullscreen noremoteplayback"></video>
      <div class="l-overlay">3/2</div>
    </div>

  </div>
</div>

<script>
  async function syncAndPlayAllVideos() {
    const videos = Array.from(document.querySelectorAll('video'));

    // Step 1: Ensure muted state is set programmatically BEFORE loading
    videos.forEach(v => {
      v.muted = true;
      v.defaultMuted = true;
      v.pause();
    });

    // Step 2: Wait until every video has loaded enough frame data (readyState >= 2)
    const loadPromises = videos.map(v => {
      return new Promise((resolve) => {
        if (v.readyState >= 2) {
          resolve();
        } else {
          v.addEventListener('canplay', () => resolve(), { once: true });
          v.load();
        }
      });
    });

    await Promise.all(loadPromises);

    // Step 3: Align playback time to 0.0 seconds across all videos
    videos.forEach(v => {
      v.currentTime = 0;
    });

    // Step 4: Batch play simultaneously
    const playPromises = videos.map(v => v.play());
    
    // Fallback trigger for iOS/iPad initial user interaction policy
    Promise.all(playPromises).catch(() => {
      const forcePlayOnInteraction = () => {
        videos.forEach(v => {
          v.currentTime = 0;
          v.play();
        });
      };
      document.addEventListener('touchstart', forcePlayOnInteraction, { once: true });
      document.addEventListener('click', forcePlayOnInteraction, { once: true });
    });
  }

  if (document.readyState === 'complete') {
    syncAndPlayAllVideos();
  } else {
    window.addEventListener('load', syncAndPlayAllVideos);
  }
</script>

</body>
</html>
