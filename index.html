<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>VVB Wave Animations</title>
  
  <!-- MathJax for rendering exact LaTeX math font styles -->
  <script src="https://polyfill.io/v3/polyfill.min.js?features=es6"></script>
  <script id="MathJax-script" async src="https://cdn.jsdelivr.net/npm/mathjax@3/es5/tex-mml-chtml.js"></script>
  
  <style>
    body {
      font-family: Arial, sans-serif;
      background-color: #ffffff;
      color: #000000;
      margin: 20px;
      display: flex;
      flex-direction: column;
      align-items: center;
    }

    .slide-container {
      width: 100%;
      max-width: 1000px;
    }

    .slide-title {
      font-size: 1.2rem;
      margin-bottom: 4px;
    }

    .slide-subtitle {
      font-size: 1.05rem;
      margin-top: 0;
      margin-bottom: 16px;
    }

    /* Grid Layout */
    .animation-grid {
      display: grid;
      grid-template-columns: 140px repeat(4, 1fr);
      border: 1px solid #ffffff;
      background-color: #ffffff;
    }

    /* Headers & Labels */
    .header-cell, .label-cell, .corner-cell {
      background-color: #f2a47e;
      display: flex;
      justify-content: center;
      align-items: center;
      font-size: 1.3rem;
      border: 1px solid #ffffff;
      padding: 10px;
    }

    .corner-cell {
      flex-direction: column;
      gap: 8px;
    }

    .badge {
      background-color: #8c8c8c;
      color: #ffffff;
      padding: 4px 12px;
      border-radius: 4px;
      font-size: 1.1rem;
      box-shadow: 2px 2px 4px rgba(0,0,0,0.3);
    }

    /* Video Cells & Badges */
    .video-cell {
      background-color: #333333;
      border: 1px solid #ffffff;
      position: relative;
      aspect-ratio: 1 / 1;
      overflow: hidden;
    }

    video {
      width: 100%;
      height: 100%;
      object-fit: cover;
      display: block;
    }

    .dl-label {
      position: absolute;
      bottom: 8px;
      right: 12px;
      color: #ffffff;
      font-family: Arial, sans-serif;
      font-size: 1.2rem;
      font-weight: bold;
      pointer-events: none;
      text-shadow: 1px 1px 3px rgba(0,0,0,0.8);
    }
  </style>
</head>
<body>

<div class="slide-container">
  <div class="slide-title">In the below animations : \(lpha = 0, eta = rac{\pi}{2}\)</div>
  <div class="slide-subtitle">(animations are plotted <strong>without</strong> the approximation)</div>

  <div class="animation-grid">
    <!-- Top Row: Corner + Column Headers -->
    <div class="corner-cell">
      <div class="badge">\(\sigma' = -1\)</div>
      <div class="badge">\(\sigma = 1\)</div>
    </div>
    <div class="header-cell">\(\ell' = -1\)</div>
    <div class="header-cell">\(\ell' = 0\)</div>
    <div class="header-cell">\(\ell' = 1\)</div>
    <div class="header-cell">\(\ell' = 2\)</div>

    <!-- Row 1: l = -1 -->
    <div class="label-cell">\(\ell = -1\)</div>
    <div class="video-cell">
      <video src="l_-1_lp_-1.mp4" autoplay loop muted playsinline></video>
      <div class="dl-label">\(\Delta\ell = 0\)</div>
    </div>
    <div class="video-cell">
      <video src="l_-1_lp_0.mp4" autoplay loop muted playsinline></video>
      <div class="dl-label">1</div>
    </div>
    <div class="video-cell">
      <video src="l_-1_lp_1.mp4" autoplay loop muted playsinline></video>
      <div class="dl-label">2</div>
    </div>
    <div class="video-cell">
      <video src="l_-1_lp_2.mp4" autoplay loop muted playsinline></video>
      <div class="dl-label">3</div>
    </div>

    <!-- Row 2: l = 0 -->
    <div class="label-cell">\(\ell = 0\)</div>
    <div class="video-cell">
      <video src="l_0_lp_-1.mp4" autoplay loop muted playsinline></video>
      <div class="dl-label">&minus;1</div>
    </div>
    <div class="video-cell">
      <video src="l_0_lp_0.mp4" autoplay loop muted playsinline></video>
      <div class="dl-label">0</div>
    </div>
    <div class="video-cell">
      <video src="l_0_lp_1.mp4" autoplay loop muted playsinline></video>
      <div class="dl-label">1</div>
    </div>
    <div class="video-cell">
      <video src="l_0_lp_2.mp4" autoplay loop muted playsinline></video>
      <div class="dl-label">2</div>
    </div>

    <!-- Row 3: l = 1 -->
    <div class="label-cell">\(\ell = 1\)</div>
    <div class="video-cell">
      <video src="l_1_lp_-1.mp4" autoplay loop muted playsinline></video>
      <div class="dl-label">&minus;2</div>
    </div>
    <div class="video-cell">
      <video src="l_1_lp_0.mp4" autoplay loop muted playsinline></video>
      <div class="dl-label">&minus;1</div>
    </div>
    <div class="video-cell">
      <video src="l_1_lp_1.mp4" autoplay loop muted playsinline></video>
      <div class="dl-label">0</div>
    </div>
    <div class="video-cell">
      <video src="l_1_lp_2.mp4" autoplay loop muted playsinline></video>
      <div class="dl-label">1</div>
    </div>
  </div>
</div>

</body>
</html>
